
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080e18">
<meta name="description" content="NEXUS Intelligence V14 — centre personnel de veille et d'information.">
<link rel="manifest" href="./manifest.json">
<title>NEXUS Intelligence V14</title>
<style>
:root{
--bg:#080e18;--panel:#101b2b;--panel2:#16263a;
--line:#263c55;--text:#edf5ff;--muted:#8fa4bb;
--blue:#43d9ff;--green:#48dfb0;--amber:#f2bd62;--red:#ff7777
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#142b43 0%,#080e18 60%);color:var(--text);font-family:Arial,sans-serif}
header{padding:17px;background:#080e18;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1000}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:calc(29px * var(--font-scale,1));font-weight:900;letter-spacing:6px}
.logo span{color:var(--blue)}
.system{color:var(--green);font-size:calc(10px * var(--font-scale,1))}
.edition{color:var(--muted);font-size:calc(9px * var(--font-scale,1));letter-spacing:2px;margin-top:8px}
main{max-width:1100px;margin:auto;padding:22px 15px 110px}
.page{display:none}
.page.active{display:block}
h1{font-size:calc(27px * var(--font-scale,1));line-height:1.25;margin:13px 0}
h2.section{font-size:calc(12px * var(--font-scale,1));letter-spacing:1.7px;margin:27px 0 13px}
