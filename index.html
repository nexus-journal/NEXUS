<!DOCTYPE html>

<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#10243a;--line:#24445d;--text:#eaf5ff;--muted:#91a8bc;--cyan:#21c7d9;--teal:#70e5d1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% -10%,#173b55,var(--bg) 65%);color:var(--text);font:14px/1.6 system-ui,Arial,sans-serif}
main{width:min(560px,100%);padding:24px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#10243a,#091522);box-shadow:0 20px 65px #0007}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.core{position:relative;width:38px;height:38px;border:1px solid var(--cyan);border-radius:50%;box-shadow:0 0 18px #21c7d966}
.core:before,.core:after{content:"";position:absolute;inset:4px;border:1px solid #21c7d9aa;border-radius:50%;transform:scaleX(.55);animation:orbit 7s linear infinite}

.core i{position:absolute;inset:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
@keyframes orbit{to{transform:rotate(360deg) scaleX(.55)}}
h1{font-size:24px;line-height:1.2;margin:0 0 8px}
p{color:var(--muted);margin:8px 0}
.status{margin-top:20px;padding:13px;border:1px solid var(--line);border-radius:11px;background:#081522;white-space:pre-wrap;overflow-wrap:anywhere}
.status.error{color:#ffd0bc;border-color:#80524a}
.bar{height:4px;background:#1d3448;border-radius:8px;overflow:hidden;margin-top:16px}
.bar i{display:block;width:12%;height:100%;background:linear-gradient(90deg,var(--cyan),var(--teal));transition:width .25s}
small{color:var(--muted)}
@media(prefers-reduced-motion:reduce){.core:before,.core:after{animation:none}}
</style>
</head>

function replaceOnce(source,needle,replacement,label){
 const p=source.indexOf(needle);
 if(p<0)throw new Error("Repère source introuvable : "+label);
 if(source.indexOf(needle,p+needle.length)>=0)throw new Error("Repère source ambigu : "+label);
 return source.slice(0,p)+replacement+source.slice(p+needle.length);
}

 let html=base;

 root.style.setProperty("--fx-intensity",String(intensity));root.style.setProperty("--fx-light",String(light));root.style.setProperty("--fx-speed",String(speed));
 body.classList.toggle("fx-core-on",!!p.fxCoreEnabled&&!reduced);body.classList.toggle("fx-light-flow",!!p.fxLightFlowEnabled&&!reduced&&intensity>.03);
 body.classList.toggle("fx-particles-on",!!p.fxParticlesEnabled&&!reduced&&intensity>.03);body.classList.toggle("fx-atmosphere-on",!!p.fxAtmosphereEnabled&&!reduced&&light>.02);
 body.classList.toggle("fx-radar-on",!!p.fxRadarEnabled&&!reduced);body.classList.toggle("fx-glow-on",light>.02);

function syncNexusFXControls(){
 const ids={fxIntensity:"fxIntensity",fxLightIntensity:"fxLightIntensity",fxAnimationSpeed:"fxAnimationSpeed",fxCoreEnabled:"fxCoreEnabled",fxLightFlowEnabled:"fxLightFlowEnabled",fxParticlesEnabled:"fxParticlesEnabled",fxAtmosphereEnabled:"fxAtmosphereEnabled",fxRadarEnabled:"fxRadarEnabled",fxHapticsEnabled:"fxHapticsEnabled",fxSoundEnabled:"fxSoundEnabled"};
 Object.entries(ids).forEach(([id,key])=>{const el=document.getElementById(id);if(el){if(el.type==="checkbox")el.checked=!!nexusPrefs[key];else el.value=nexusPrefs[key]??""}});
 const selector=document.getElementById("fxPresetSelect");if(selector)selector.value=nexusPrefs.fxPreset||"hybrid";
 ["fxIntensity","fxLightIntensity"].forEach(id=>{const input=document.getElementById(id),out=document.getElementById(id+"Value");if(input&&out)out.textContent=input.value+" %"});

function saveFXChange(key,value){nexusPrefs[key]=value;nexusPrefs.fxPreset="custom";nexusPrefs.profile="custom";saveNexusPreferences();syncNexusFXControls()}
function applyNexusFXPreset(name){const preset=NEXUS_FX_PRESETS[name];if(!preset)return;nexusPrefs={...nexusPrefs,...preset};saveNexusPreferences();syncNexusFXControls();showNexusToast("Profil FX "+name.toUpperCase()+" appliqué.")}
function saveCustomNexusFX(){
 const name=(document.getElementById("fxCustomName")?.value||"").trim()||"Mon profil";
 const data={name,preferences:Object.fromEntries(NEXUS_FX_FIELDS.map(k=>[k,nexusPrefs[k]]))};
 try{localStorage.setItem(NEXUS_FX_CUSTOM_KEY,JSON.stringify(data));showNexusToast("Préréglage personnalisé enregistré.")}catch(e){showNexusToast("Impossible de sauvegarder le préréglage.")}

 try{const data=JSON.parse(localStorage.getItem(NEXUS_FX_CUSTOM_KEY)||"null");if(!data||!data.preferences)throw new Error("Aucun profil");

function playNexusFXSound(){
 if(!nexusPrefs.fxSoundEnabled)return;
 try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;const ctx=new AudioCtx(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type="sine";osc.frequency.value=720;
 gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.018,ctx.currentTime+.012);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.075);
 osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.08);osc.onended=()=>ctx.close()}catch(e){}
}
function triggerNexusHaptic(){if(!nexusPrefs.fxHapticsEnabled||!navigator.vibrate)return;try{navigator.vibrate(10)}catch(e){}}
function initNexusFX(){
 applyNexusFXVisuals();syncNexusFXControls();
 const keys={fxIntensity:"fxIntensity",fxLightIntensity:"fxLightIntensity",fxAnimationSpeed:"fxAnimationSpeed",fxCoreEnabled:"fxCoreEnabled",fxLightFlowEnabled:"fxLightFlowEnabled",fxParticlesEnabled:"fxParticlesEnabled",fxAtmosphereEnabled:"fxAtmosphereEnabled",fxRadarEnabled:"fxRadarEnabled",fxHapticsEnabled:"fxHapticsEnabled",fxSoundEnabled:"fxSoundEnabled"};
 Object.entries(keys).forEach(([id,key])=>{const el=document.getElementById(id);if(!el)return;const update=()=>saveFXChange(key,el.type==="checkbox"?el.checked:el.type==="range"?Number(el.value):el.value);el.addEventListener("input",update);el.addEventListener("change",update)});
 document.getElementById("fxPresetSelect")?.addEventListener("change",e=>applyNexusFXPreset(e.target.value));
 document.querySelectorAll("[data-fx-preset]").forEach(b=>b.addEventListener("click",()=>applyNexusFXPreset(b.dataset.fxPreset)));
 document.getElementById("saveCustomFX")?.addEventListener("click",saveCustomNexusFX);document.getElementById("loadCustomFX")?.addEventListener("click",loadCustomNexusFX);
 document.getElementById("resetFX")?.addEventListener("click",()=>applyNexusFXPreset("hybrid"));
 document.addEventListener("click",e=>{const target=e.target.closest("button,.small-btn,.primary,[role=button]");if(!target)return;if(nexusPrefs.fxHapticsEnabled)triggerNexusHaptic();playNexusFXSound()});
}

 );
 html=html.replaceAll("version:13","version:14");

 for(const marker of required)if(!html.includes(marker))throw new Error("Validation échouée : "+marker);
 if(!html.endsWith("</html>"))throw new Error("Document HTML incomplet.");
 if(/Market Studio|Market Overview|id="market"/i.test(html))throw new Error("Un module Market non souhaité a été détecté.");

async function start(){
 try{
  progress(12);
  let built=localStorage.getItem(CACHE_KEY);
  if(!built||!built.includes(BUILD_ID)){
   status("Récupération de la base NEXUS depuis le commit source…");
   const response=await fetch(SOURCE_URL,{cache:"force-cache"});
   if(!response.ok)throw new Error("Source GitHub inaccessible (HTTP "+response.status+"). Vérifie la connexion.");
   progress(48);
   const base=await response.text();
   if(base.length<80000)throw new Error("Le fichier source reçu semble incomplet.");
   status("Intégration des effets visuels, animations, préréglages et réglages haptiques…");
   built=patchNexusV14(base);
   built=built.replace("</head>",'<meta name="nexus-build" content="'+BUILD_ID+'">\n</head>');
   try{localStorage.setItem(CACHE_KEY,built)}catch(e){console.warn("Cache local non disponible",e)}
  }
  progress(92);
  if(!built.includes(BUILD_ID)||!built.endsWith("</html>"))throw new Error("La version locale en cache n'est pas valide.");
  progress(100);
  document.open();document.write(built);document.close();
 }catch(error){
  status("Initialisation impossible : "+error.message+"\n\nRecharge la page lorsque la connexion est disponible.",true);
  progress(0);
 }
}
start();
