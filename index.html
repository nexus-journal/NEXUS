 ['France 24','https://www.france24.com/fr/','Média international','Actualités'],['RFI','https://www.rfi.fr/fr/','Média international','Actualités'],['franceinfo','https://www.francetvinfo.fr/','Média public','Actualités'],['Le Monde','https://www.lemonde.fr/','Presse','Actualités'],['BBC News','https://www.bbc.com/news','Média international','Actualités'],['The Guardian','https://www.theguardian.com/international','Presse','Actualités'],['Deutsche Welle','https://www.dw.com/','Média international','Actualités'],['Al Jazeera','https://www.aljazeera.com/','Média international','Actualités'],['NASA','https://www.nasa.gov/news/','Institution scientifique','Sciences'],['ESA','https://www.esa.int/Newsroom','Institution scientifique','Sciences']

const nowISO=()=>new Date().toISOString();
const uid=()=>('n'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));
const freshStore=()=>({version:1,activeWorkspaceId:'ws-personal',workspaces:[{id:'ws-personal',name:'Personal',createdAt:nowISO()}],prefs:{accent:'#22d3ee',fontScale:1,compact:false,motion:true,glass:true,defaultPage:'overview'},articles:[],events:[],dossiers:[],analyses:[],resources:[],relations:[],market:[],datasets:[],watchTopics:[],sources:SOURCE_SEEDS.map((s,i)=>({id:'src-'+i,name:s[0],url:s[1],kind:s[2],category:s[3],enabled:true,custom:false}))});
let state=loadStore(),currentPage='overview',mapInstance=null,mapScriptPromise=null,lastSearch='';
function loadStore(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw)return freshStore();const parsed=JSON.parse(raw);const base=freshStore();return {...base,...parsed,prefs:{...base.prefs,...(parsed.prefs||{})},workspaces:Array.isArray(parsed.workspaces)&&parsed.workspaces.length?parsed.workspaces:base.workspaces,sources:Array.isArray(parsed.sources)?parsed.sources:base.sources,articles:Array.isArray(parsed.articles)?parsed.articles:[],events:Array.isArray(parsed.events)?parsed.events:[],dossiers:Array.isArray(parsed.dossiers)?parsed.dossiers:[],analyses:Array.isArray(parsed.analyses)?parsed.analyses:[],resources:Array.isArray(parsed.resources)?parsed.resources:[],relations:Array.isArray(parsed.relations)?parsed.relations:[],market:Array.isArray(parsed.market)?parsed.market:[],datasets:Array.isArray(parsed.datasets)?parsed.datasets:[],watchTopics:Array.isArray(parsed.watchTopics)?parsed.watchTopics:[]};}catch(e){console.warn('NEXUS storage reset:',e);return freshStore();}}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){toast('Stockage local saturé ou indisponible.');console.error(e);}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:'';}catch{return '';}}
function fmtDate(v,withTime=false){if(!v)return 'Date inconnue';const d=new Date(v);if(Number.isNaN(d.getTime()))return 'Date inconnue';return new Intl.DateTimeFormat('fr-FR',withTime?{dateStyle:'medium',timeStyle:'short'}:{dateStyle:'medium'}).format(d);}
function currentWorkspace(){return state.workspaces.find(w=>w.id===state.activeWorkspaceId)||state.workspaces[0];}
function scoped(key){return (state[key]||[]).filter(x=>x.workspaceId===state.activeWorkspaceId);}
function addScoped(key,item){state[key].push({...item,id:item.id||uid(),workspaceId:state.activeWorkspaceId,createdAt:item.createdAt||nowISO(),updatedAt:nowISO()});save();}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2400);}
function setPage(id){if(!NAV.some(n=>n.id===id))id='overview';currentPage=id;document.getElementById('mobileDrawer').classList.remove('open');render();window.scrollTo({top:0,behavior:state.prefs.motion?'smooth':'auto'});}
function pageHead(eyebrow,title,subtitle,actions=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1><p class="page-subtitle">${subtitle}</p></div><div class="head-actions">${actions}</div></div>`;}
function panel(title,content,extra=''){return `<section class="panel panel-pad ${extra}"><div class="panel-head"><h2 class="panel-title">${title}</h2></div>${content}</section>`;}
function empty(icon,title,copy,action=''){return `<div class="empty"><div class="empty-icon">${icon}</div><strong>${title}</strong><p>${copy}</p>${action}</div>`;}
function actionBtn(action,label,kind=''){return `<button class="btn ${kind}" data-action="${action}">${label}</button>`;}
function renderNav(){const nav=document.getElementById('mainNav');let html='',last='';NAV.forEach(n=>{if(n.group!==last){html+=`<div class="section-label" style="margin-top:${last?'15px':'0'}">${n.group}</div>`;last=n.group;}html+=`<button class="nav-item ${currentPage===n.id?'active':''}" data-page="${n.id}"><span class="nav-icon">${n.icon}</span><span>${n.label}</span></button>`;});nav.innerHTML=html;document.getElementById('drawerGrid').innerHTML=NAV.map(n=>`<button data-page="${n.id}"><span>${n.icon}</span>${n.label}</button>`).join('');document.querySelectorAll('.mobile-nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));document.getElementById('workspaceName').textContent=currentWorkspace()?.name||'Personal';}
function render(){renderNav();const n=NAV.find(x=>x.id===currentPage);document.getElementById('crumbTitle').textContent=n?.label||'Overview';const root=document.getElementById('content');const pages={overview:renderOverview,news:renderNews,map:renderMap,intel:renderIntel,timeline:renderTimeline,sources:renderSources,analyst:renderAnalyst,dossiers:renderDossiers,favorites:renderFavorites,archives:renderArchives,alerts:renderAlerts,science:renderScience,market:renderMarket,datalab:renderDataLab,graph:renderGraph,library:renderLibrary,reports:renderReports,fx:renderFX,settings:renderSettings};root.innerHTML=(pages[currentPage]||renderOverview)();if(currentPage==='map')initMap();if(currentPage==='graph')drawGraph();}
function renderOverview(){const arts=scoped('articles').filter(x=>!x.archived),events=scoped('events').filter(x=>!x.archived),dossiers=scoped('dossiers'),resources=scoped('resources');const urgent=events.filter(e=>e.priority==='Élevée').slice(0,4);const recent=[...arts].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,4);const dt=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());return `${pageHead('Personal intelligence workspace','Votre monde, en contexte.',`Vue d'ensemble du ${dt}. Un espace de veille personnel, organisé autour de vos informations.`,actionBtn('new-article','＋ Ajouter une information','primary'))}
<div class="grid grid-4" style="margin-bottom:15px"><div class="panel stat-card"><div class="stat-icon">▤</div><div class="stat-label">Informations enregistrées</div><div class="stat-value">${arts.length}</div><div class="stat-foot">Dans cet espace</div></div><div class="panel stat-card"><div class="stat-icon">◎</div><div class="stat-label">Événements suivis</div><div class="stat-value">${events.length}</div><div class="stat-foot">Repères géographiques inclus</div></div><div class="panel stat-card"><div class="stat-icon">▣</div><div class="stat-label">Dossiers actifs</div><div class="stat-value">${dossiers.length}</div><div class="stat-foot">Votre mémoire de travail</div></div><div class="panel stat-card"><div class="stat-icon">▧</div><div class="stat-label">Ressources conservées</div><div class="stat-value">${resources.length}</div><div class="stat-foot">Liens et références</div></div></div>
<div class="grid grid-2" style="margin-bottom:15px"><section class="panel feature-panel"><div class="eyebrow">NEXUS DAILY PULSE</div><h2>Comprendre d'abord. Approfondir ensuite.</h2><p>NEXUS relie les articles, événements, sources, dossiers et analyses que vous choisissez de conserver. Votre briefing se construit à partir de vos données, sans actualité fictive ni indicateur inventé.</p><div class="feature-meta"><span>LOCAL-FIRST</span><span class="mini-line"></span><span>${events.length} ÉVÉNEMENT(S)</span></div></section><section class="panel panel-pad"><div class="panel-head"><h2 class="panel-title">Accès rapide</h2><span class="panel-kicker">QUICK ACTIONS</span></div><div class="quick-actions"><button class="quick-action" data-action="new-article"><span>＋</span><b>Ajouter un article</b></button><button class="quick-action" data-action="new-event"><span>◎</span><b>Créer un événement</b></button><button class="quick-action" data-action="new-dossier"><span>▣</span><b>Nouveau dossier</b></button><button class="quick-action" data-page="reports"><span>▤</span><b>Créer un rapport</b></button></div></section></div>
<div class="grid grid-2"><section class="panel panel-pad"><div class="panel-head"><h2 class="panel-title">Événements à suivre</h2><button class="btn small ghost" data-page="intel">Voir tout →</button></div>${urgent.length?`<div class="list">${urgent.map(e=>`<div class="list-row"><span class="item-marker" style="background:var(--amber)"></span><div class="item-body"><div class="item-title">${esc(e.title)}</div><div class="item-meta">${esc(e.location||'Lieu non précisé')} · ${fmtDate(e.date||e.createdAt)}</div></div><span class="tag amber">ÉLEVÉE</span></div>`).join('')}</div>`:empty('◈','Aucun événement prioritaire','Ajoutez vos propres événements pour créer une veille géographique et chronologique.',actionBtn('new-event','＋ Créer un événement','small'))}</section><section class="panel panel-pad"><div class="panel-head"><h2 class="panel-title">Dernières informations</h2><button class="btn small ghost" data-page="news">Ouvrir →</button></div>${recent.length?`<div class="list">${recent.map(a=>`<div class="list-row"><span class="item-marker"></span><div class="item-body"><div class="item-title">${esc(a.title)}</div><div class="item-meta">${esc(a.source||'Source personnelle')} · ${fmtDate(a.createdAt)}</div></div></div>`).join('')}</div>`:empty('▤','Votre veille commence ici','Enregistrez un article ou une référence. NEXUS ne crée pas de fausses actualités.',actionBtn('new-article','＋ Ajouter un article','small'))}</section></div>
<div style="margin-top:15px" class="callout"><strong>État des connexions :</strong> stockage local opérationnel. Les flux d'actualité, les cotations en direct, l'analyse IA et la synchronisation cloud ne sont pas connectés dans cette version statique.</div>`;}
function renderNews(){const arts=scoped('articles').filter(x=>!x.archived).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));return `${pageHead('Discover / Information stream','Actualités','Conservez et organisez vos articles. Chaque entrée garde sa source et son lien d’origine.',actionBtn('new-article','＋ Ajouter un article','primary'))}<div class="toolbar"><input class="field" id="newsFilter" placeholder="Filtrer les informations…"><select class="select" id="newsCategory" style="width:auto"><option value="">Toutes catégories</option>${['France','Monde','Politique','Économie','Technologie','Sciences','Environnement','Défense','Exploration','Autre'].map(x=>`<option>${x}</option>`).join('')}</select><span class="tag">${arts.length} ENREGISTRÉ(S)</span></div><div id="newsList">${newsList(arts)}</div><div class="divider"></div>${panel('Sources de découverte',`<div class="callout">Les médias ci-dessous sont des liens vers leurs sites d’origine. Aucun flux n’est présenté comme connecté ou actualisé automatiquement.</div><div class="source-row"><div><div class="source-name">France 24 · RFI · franceinfo</div><div class="source-url">Médias d’actualité francophones</div></div><button class="btn small" data-page="sources">Sources →</button></div>`)}`;}
function newsList(arts){if(!arts.length)return empty('▤','Aucun article enregistré','Ajoutez un article avec son titre, sa source et son lien.');return `<div class="list">${arts.map(a=>`<div class="list-row"><span class="item-marker"></span><div class="item-body"><div class="item-title">${esc(a.title)}</div><div class="item-meta">${esc(a.source||'Source non précisée')} · ${esc(a.category||'Non classé')} · ${fmtDate(a.createdAt)}</div>${a.summary?`<div class="muted tiny" style="margin-top:6px">${esc(a.summary)}</div>`:''}${a.url?`<a class="tiny" href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener noreferrer">Ouvrir la source ↗</a>`:''}</div><div class="item-actions"><button class="btn small" data-action="toggle-favorite" data-id="${a.id}">${a.favorite?'★':'☆'}</button><button class="btn small" data-action="toggle-archive" data-kind="articles" data-id="${a.id}">${a.archived?'Restaurer':'Archiver'}</button><button class="btn small" data-action="article-to-dossier" data-id="${a.id}">＋ Dossier</button><button class="btn small danger" data-action="delete-item" data-kind="articles" data-id="${a.id}">×</button></div></div>`).join('')}</div>`;}
function renderMap(){const events=scoped('events');return `${pageHead('Monitor / Geospatial view','Global Situation','Visualisez vos événements géolocalisés. Les marqueurs proviennent uniquement des éléments que vous ajoutez.',actionBtn('new-event','＋ Ajouter un événement','primary'))}<div class="grid grid-2" style="grid-template-columns:minmax(0,1.6fr) minmax(260px,.8fr)"><section class="panel" style="padding:10px"><div class="map-wrap"><div id="worldMap"></div><div class="map-note">OPENSTREETMAP · CARTE FOURNIE PAR UN SERVICE EXTERNE</div></div></section><section class="panel panel-pad"><div class="panel-head"><h2 class="panel-title">Événements cartographiés</h2><span class="tag">${events.filter(e=>Number.isFinite(+e.lat)&&Number.isFinite(+e.lng)).length} POINT(S)</span></div>${events.length?`<div class="list">${events.map(e=>`<div class="list-row"><span class="item-marker" style="background:${e.priority==='Élevée'?'var(--amber)':'var(--accent)'}"></span><div class="item-body"><div class="item-title">${esc(e.title)}</div><div class="item-meta">${esc(e.location||'Lieu non précisé')} · ${e.lat&&e.lng?`${e.lat}, ${e.lng}`:'Sans coordonnées'}</div></div><button class="btn small" data-action="focus-event" data-id="${e.id}">Voir</button></div>`).join('')}</div>`:empty('◎','Carte encore vide','Créez un événement et ajoutez ses coordonnées pour le localiser.',actionBtn('new-event','＋ Ajouter','small'))}<div class="divider"></div><div class="callout">La carte utilise OpenStreetMap lorsque la connexion Internet est disponible. Sans réseau, vos événements restent accessibles dans la liste.</div></section></div>`;}
function renderIntel(){const events=scoped('events').filter(x=>!x.archived).slice().sort((a,b)=>priorityScore(b.priority)-priorityScore(a.priority)||new Date(b.updatedAt)-new Date(a.updatedAt));return `${pageHead('Monitor / Signal prioritization','Top Intelligence','Une hiérarchisation éditoriale basée sur la priorité que vous attribuez. Aucun score automatique de crédibilité ou d’importance n’est inventé.',actionBtn('new-event','＋ Ajouter un signal','primary'))}<div class="callout" style="margin-bottom:15px">Règle de classement actuelle : priorité manuelle (Élevée, Normale, Faible), puis date de mise à jour. Ce classement est explicable et modifiable.</div>${events.length?`<div class="list">${events.map((e,i)=>`<section class="panel panel-pad" style="margin-bottom:10px"><div class="row" style="display:flex;align-items:flex-start;gap:13px"><div style="font:700 24px Manrope;color:var(--subtle)">${String(i+1).padStart(2,'0')}</div><div style="flex:1;min-width:0"><div class="eyebrow">${esc(e.category||'Événement')} · ${esc(e.priority||'Normale')}</div><div class="item-title" style="font-size:14px">${esc(e.title)}</div><div class="item-meta">${esc(e.location||'Lieu non précisé')} · ${fmtDate(e.date||e.createdAt)}</div>${e.description?`<p class="muted tiny">${esc(e.description)}</p>`:''}</div><div class="item-actions"><button class="btn small" data-action="toggle-item-favorite" data-kind="events" data-id="${e.id}">${e.favorite?'★':'☆'}</button><button class="btn small" data-action="toggle-archive" data-kind="events" data-id="${e.id}">${e.archived?'Restaurer':'Archiver'}</button><button class="btn small" data-action="edit-event" data-id="${e.id}">Modifier</button></div></div></section>`).join('')}</div>`:empty('◈','Aucun signal suivi','Ajoutez des événements et définissez leur priorité pour construire votre tableau de veille.',actionBtn('new-event','＋ Créer un événement','small'))}`;}
function priorityScore(p){return p==='Élevée'?3:p==='Normale'?2:1;}
function renderTimeline(){const items=[...scoped('events').filter(x=>!x.archived).map(e=>({...e,_kind:'Événement',_date:e.date||e.createdAt})),...scoped('articles').filter(x=>!x.archived).map(a=>({...a,_kind:'Article',_date:a.publishedAt||a.createdAt}))].sort((a,b)=>new Date(b._date)-new Date(a._date));return `${pageHead('Monitor / Chronology','Timeline','Suivez le déroulement des événements et retrouvez les informations associées dans l’ordre chronologique.',actionBtn('new-event','＋ Ajouter un jalon','primary'))}<div class="panel panel-pad">${items.length?`<div class="timeline">${items.map(x=>`<div class="timeline-item"><div class="timeline-date">${fmtDate(x._date,true)} · ${x._kind.toUpperCase()}</div><div class="timeline-title">${esc(x.title)}</div><div class="timeline-copy">${esc(x.location||x.source||x.category||'')} ${x.description?`— ${esc(x.description)}`:''}</div></div>`).join('')}</div>`:empty('◷','Aucune chronologie','Ajoutez des articles ou des événements pour faire apparaître les jalons.')}</div>`;}
function renderSources(){return `${pageHead('Monitor / Transparency','Source Monitor','Organisez les médias, institutions et références. NEXUS expose les origines et ne distribue pas de note de crédibilité absolue.',`<button class="btn primary" data-action="new-source">＋ Ajouter une source</button>`)}<div class="grid grid-2"><section class="panel panel-pad"><div class="panel-head"><h2 class="panel-title">Répertoire des sources</h2><span class="tag">${state.sources.length} SOURCE(S)</span></div><div class="list">${state.sources.map(s=>`<div class="source-row"><div><div class="source-name">${esc(s.name)} ${s.enabled?'<span class="tag green">ACTIF</span>':'<span class="tag">DÉSACTIVÉ</span>'}</div><div class="source-url">${esc(s.url)}</div><div class="source-class">${esc(s.kind)} · ${esc(s.category)}</div></div><div class="item-actions"><button class="btn small" data-action="toggle-source" data-id="${s.id}">${s.enabled?'Désactiver':'Activer'}</button>${s.custom?`<button class="btn small danger" data-action="delete-item" data-kind="sources" data-id="${s.id}">×</button>`:''}</div></div>`).join('')}</div></section><section class="panel panel-pad"><h2 class="panel-title">Transparence des informations</h2><div class="list" style="margin-top:13px"><div class="list-row"><span class="item-marker"></span><div class="item-body"><div class="item-title">Origine</div><div class="item-meta">Conserver l’URL, le nom du média et l’auteur lorsqu’il est connu.</div></div></div><div class="list-row"><span class="item-marker"></span><div class="item-body"><div class="item-title">Temporalité</div><div class="item-meta">Distinguer date de publication, date d’ajout et date de mise à jour.</div></div></div><div class="list-row"><span class="item-marker"></span><div class="item-body"><div class="item-title">Nature de la source</div><div class="item-meta">Identifier les sources primaires et secondaires lorsque cette information est vérifiable.</div></div></div></div><div class="divider"></div><div class="callout">Les sources prédéfinies sont des raccourcis vers des sites publics. Elles ne signifient pas qu’un flux automatique est connecté.</div></section></div>`;}
function renderAnalyst(){const analyses=scoped('analyses').slice().sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));return `${pageHead('Intelligence / Research workspace','Analyst','Construisez vos analyses en séparant les faits documentés, les hypothèses et les points qui restent incertains.',`<button class="btn primary" data-action="new-analysis">＋ Nouvelle analyse</button>`)}<div class="callout" style="margin-bottom:15px"><strong>Cadre de rigueur :</strong> aucune synthèse IA n’est exécutée dans cette version. Les textes sont vos notes, et les champs distinguent explicitement les faits des hypothèses.</div>${analyses.length?`<div class="card-grid">${analyses.map(a=>`<article class="entity-card"><div class="eyebrow">${esc(a.topic||'Analyse personnelle')}</div><h3>${esc(a.title)}</h3><p>${esc(a.question||'Aucune problématique renseignée')}</p><div class="entity-foot"><span class="tag">${fmtDate(a.updatedAt)}</span><button class="btn small" data-action="edit-analysis" data-id="${a.id}">Ouvrir</button></div></article>`).join('')}</div>`:empty('⌕','Aucune analyse','Créez un espace de réflexion et documentez vos observations.',actionBtn('new-analysis','＋ Créer une analyse','small'))}`;}
function renderDossiers(){const dossiers=scoped('dossiers').sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));return `${pageHead('Knowledge / Personal memory','Dossiers','Des espaces durables pour rassembler articles, événements, notes et références autour d’un sujet.',actionBtn('new-dossier','＋ Nouveau dossier','primary'))}${dossiers.length?`<div class="card-grid">${dossiers.map(d=>{const count=(d.articleIds||[]).length+(d.eventIds||[]).length;return `<article class="entity-card"><div class="eyebrow">DOSSIER · ${fmtDate(d.updatedAt)}</div><h3>${esc(d.title)}</h3><p>${esc(d.description||'Aucune description')}</p><div class="entity-foot"><span class="tag">${count} ÉLÉMENT(S)</span><div><button class="btn small" data-action="open-dossier" data-id="${d.id}">Ouvrir</button><button class="btn small danger" data-action="delete-item" data-kind="dossiers" data-id="${d.id}">×</button></div></div></article>`;}).join('')}</div>`:empty('▣','Votre mémoire commence ici','Créez un dossier pour suivre un sujet dans le temps.',actionBtn('new-dossier','＋ Créer un dossier','small'))}`;}
function renderFavorites(){const arts=scoped('articles').filter(x=>x.favorite&&!x.archived),events=scoped('events').filter(x=>x.favorite&&!x.archived);return `${pageHead('Knowledge / Saved items','Favoris','Retrouvez les articles et événements que vous souhaitez garder à portée de main.','')}<div class="grid grid-2"><section class="panel panel-pad"><div class="panel-head"><h2 class="panel-title">Articles favoris</h2><span class="tag">${arts.length}</span></div>${arts.length?`<div class="list">${arts.map(a=>`<div class="list-row"><span class="item-marker"></span><div class="item-body"><div class="item-title">${esc(a.title)}</div><div class="item-meta">${esc(a.source||'')} · ${fmtDate(a.createdAt)}</div></div><button class="btn small" data-action="toggle-favorite" data-id="${a.id}">★</button></div>`).join('')}</div>`:empty('☆','Aucun article favori','Enregistrez des articles puis marquez-les d’une étoile.')}</section><section class="panel panel-pad"><div class="panel-head"><h2 class="panel-title">Événements favoris</h2><span class="tag">${events.length}</span></div>${events.length?`<div class="list">${events.map(e=>`<div class="list-row"><span class="item-marker"></span><div class="item-body"><div class="item-title">${esc(e.title)}</div><div class="item-meta">${esc(e.location||'')} · ${fmtDate(e.date||e.createdAt)}</div></div><button class="btn small" data-action="toggle-item-favorite" data-kind="events" data-id="${e.id}">★</button></div>`).join('')}</div>`:empty('☆','Aucun événement favori','Marquez les événements importants depuis Top Intelligence.')}</section></div>`;}
function renderArchives(){const arts=scoped('articles').filter(x=>x.archived),events=scoped('events').filter(x=>x.archived);return `${pageHead('Knowledge / Long-term memory','Archives','Retrouvez les informations que vous avez choisi de retirer de vos vues actives.','')}<div class="grid grid-2"><section class="panel panel-pad"><div class="panel-head"><h2 class="panel-title">Articles archivés</h2><span class="tag">${arts.length}</span></div>${arts.length?`<div class="list">${arts.map(a=>`<div class="list-row"><span class="item-marker"></span><div class="item-body"><div class="item-title">${esc(a.title)}</div><div class="item-meta">${esc(a.source||'')} · ${fmtDate(a.createdAt)}</div></div><button class="btn small" data-action="toggle-archive" data-kind="articles" data-id="${a.id}">Restaurer</button></div>`).join('')}</div>`:empty('▧','Aucun article archivé','Archivez les informations que vous souhaitez conserver sans les garder dans le flux actif.')}</section><section class="panel panel-pad"><div class="panel-head"><h2 class="panel-title">Événements archivés</h2><span class="tag">${events.length}</span></div>${events.length?`<div class="list">${events.map(e=>`<div class="list-row"><span class="item-marker"></span><div class="item-body"><div class="item-title">${esc(e.title)}</div><div class="item-meta">${esc(e.location||'')} · ${fmtDate(e.date||e.createdAt)}</div></div><button class="btn small" data-action="toggle-archive" data-kind="events" data-id="${e.id}">Restaurer</button></div>`).join('')}</div>`:empty('▧','Aucun événement archivé','Les événements terminés peuvent être déplacés ici.')}</section></div>`;}
function renderAlerts(){const topics=scoped('watchTopics'),arts=scoped('articles').filter(a=>!a.archived),events=scoped('events').filter(e=>!e.archived);return `${pageHead('Monitor / Personal watchlist','Suivi & alertes','Définissez des sujets à surveiller dans vos données enregistrées. Ce module ne déclenche aucune notification ni surveillance en arrière-plan.',actionBtn('new-watch','＋ Ajouter un sujet','primary'))}<div class="callout" style="margin-bottom:15px"><strong>Mode local uniquement :</strong> les sujets sont comparés aux articles et événements déjà enregistrés. Aucune alerte push, aucun envoi automatique et aucune veille externe ne sont exécutés.</div>${topics.length?`<div class="card-grid">${topics.map(t=>{const term=t.title.toLowerCase();const matches=[...arts,...events].filter(x=>JSON.stringify(x).toLowerCase().includes(term));return `<article class="entity-card"><div class="eyebrow">${esc(t.category)} · ${esc(t.priority)}</div><h3>${esc(t.title)}</h3><p>${matches.length} correspondance(s) dans votre espace local.</p><div class="entity-foot"><span class="tag">SUIVI LOCAL</span><button class="btn small danger" data-action="delete-item" data-kind="watchTopics" data-id="${t.id}">Retirer</button></div></article>`;}).join('')}</div>`:empty('◉','Aucun sujet suivi','Ajoutez un mot-clé ou une thématique pour repérer les correspondances dans vos éléments enregistrés.',actionBtn('new-watch','＋ Ajouter un sujet','small'))}`;}
function newWatch(){modalForm('Ajouter un sujet à suivre',field('Sujet ou mot-clé','title','Ex. énergie, IA, Europe…',{full:true,required:true})+selectField('Catégorie','category',['Monde','Politique','Économie','Technologie','Sciences','Environnement','Défense','Autre'])+selectField('Priorité personnelle','priority',['Faible','Normale','Élevée']),'Ajouter au suivi','watch');}
function renderScience(){const science=scoped('resources').filter(x=>x.category==='Science & Space');return `${pageHead('Discover / Research','Science & Space','Veille scientifique, exploration spatiale et références institutionnelles. Les liens renvoient aux publications d’origine.',actionBtn('new-resource','＋ Ajouter une référence','primary'))}<div class="grid grid-3" style="margin-bottom:15px">${[['NASA','https://www.nasa.gov/','Missions, recherche et exploration'],['ESA','https://www.esa.int/','Programmes spatiaux européens'],['CNRS','https://www.cnrs.fr/','Recherche scientifique française']].map(s=>`<a class="entity-card" href="${s[1]}" target="_blank" rel="noopener noreferrer"><div class="eyebrow">INSTITUTION</div><h3>${s[0]} ↗</h3><p>${s[2]}</p></a>`).join('')}</div><section class="panel panel-pad"><div class="panel-head"><h2 class="panel-title">Ma bibliothèque scientifique</h2><span class="tag">${science.length} RÉFÉRENCE(S)</span></div>${science.length?`<div class="list">${science.map(x=>resourceRow(x)).join('')}</div>`:empty('✧','Aucune référence scientifique','Enregistrez une mission, une publication ou une découverte avec sa source.')}</section>`;}
function renderMarket(){const items=scoped('market');return `${pageHead('Lab / Market monitor','Market','Une watchlist personnelle pour suivre les actifs qui vous intéressent. Aucune cotation en direct n’est simulée.',actionBtn('new-market','＋ Ajouter un actif','primary'))}<div class="callout" style="margin-bottom:15px"><strong class="unsupported">Données de marché non connectées.</strong> Cette version ne possède ni fournisseur de cotations ni clé API. Les cours ne seront affichés qu’après intégration d’une source de données fiable, avec leur horodatage et leur provenance.</div><section class="panel panel-pad"><div class="panel-head"><h2 class="panel-title">Ma watchlist</h2><span class="tag">${items.length} ACTIF(S)</span></div>${items.length?`<div class="table-wrap"><table><thead><tr><th>Actif</th><th>Type</th><th>Symbole</th><th>Note personnelle</th><th></th></tr></thead><tbody>${items.map(x=>`<tr><td><strong>${esc(x.name)}</strong></td><td>${esc(x.type)}</td><td class="mono">${esc(x.symbol||'—')}</td><td>${esc(x.note||'—')}</td><td><button class="btn small danger" data-action="delete-item" data-kind="market" data-id="${x.id}">Retirer</button></td></tr>`).join('')}</tbody></table></div>`:empty('↗','Votre watchlist est vide','Ajoutez des indices, actions, devises ou matières premières à suivre.')}</section>`;}
function renderDataLab(){const sets=scoped('datasets');return `${pageHead('Lab / Data workspace','Data Lab','Importez vos propres fichiers CSV pour explorer et comparer des données localement.',`<button class="btn primary" data-action="import-csv">＋ Importer un CSV</button>`)}<div class="callout" style="margin-bottom:15px">Les fichiers sont analysés dans votre navigateur. Les données ne sont pas envoyées à un serveur. Le parseur gère les CSV simples avec séparateur virgule ou point-virgule.</div>${sets.length?`<div class="grid" style="gap:13px">${sets.map(d=>`<section class="panel panel-pad"><div class="panel-head"><div><h2 class="panel-title">${esc(d.name)}</h2><div class="item-meta">${d.rows.length} lignes · ${d.headers.length} colonnes · importé le ${fmtDate(d.createdAt)}</div></div><button class="btn small danger" data-action="delete-item" data-kind="datasets" data-id="${d.id}">Supprimer</button></div>${dataSummary(d)}<div class="table-wrap" style="margin-top:12px"><table><thead><tr>${d.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${d.rows.slice(0,8).map(r=>`<tr>${d.headers.map((_,i)=>`<td>${esc(r[i]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`).join('')}</div>`:empty('▥','Aucun jeu de données','Importez un fichier CSV pour créer votre premier espace d’exploration.')}`;}
function dataSummary(d){const nums=d.headers.map((h,i)=>({h,i,vals:d.rows.map(r=>Number(String(r[i]??'').replace(',','.'))).filter((v,j)=>Number.isFinite(v)&&String(d.rows[j]?.[i]??'').trim()!=='')})).filter(x=>x.vals.length>=2);if(!nums.length)return '<p class="muted tiny">Aucune colonne numérique détectée pour le moment.</p>';return `<div class="grid grid-3">${nums.slice(0,3).map(x=>`<div class="entity-card"><div class="stat-label">${esc(x.h)}</div><div class="stat-value" style="font-size:19px">${(x.vals.reduce((a,b)=>a+b,0)/x.vals.length).toLocaleString('fr-FR',{maximumFractionDigits:2})}</div><div class="stat-foot">Moyenne · ${x.vals.length} valeurs numériques</div></div>`).join('')}</div>`;}
function renderGraph(){const nodes=[...scoped('dossiers').map(x=>({id:x.id,label:x.title,kind:'Dossier'})),...scoped('events').map(x=>({id:x.id,label:x.title,kind:'Événement'})),...scoped('articles').map(x=>({id:x.id,label:x.title,kind:'Article'}))].slice(0,35);const rel=scoped('relations');return `${pageHead('Knowledge / Connected information','Knowledge Graph','Visualisez les relations que vous créez entre vos dossiers, articles et événements.',actionBtn('new-relation','＋ Créer une relation','primary'))}<div class="callout" style="margin-bottom:14px">Le graphe est construit à partir de vos liens explicites. NEXUS ne prétend pas découvrir automatiquement des relations sans moteur d’analyse connecté.</div><div class="grid grid-2" style="grid-template-columns:minmax(0,1.55fr) minmax(250px,.8fr)"><section class="panel graph-panel"><svg id="knowledgeGraph" viewBox="0 0 760 430" role="img" aria-label="Graphe des relations personnelles"></svg></section><section class="panel panel-pad"><div class="panel-head"><h2 class="panel-title">Relations enregistrées</h2><span class="tag">${rel.length}</span></div>${rel.length?`<div class="list">${rel.map(r=>`<div class="list-row"><span class="item-marker"></span><div class="item-body"><div class="item-title">${esc(labelFor(r.from))} → ${esc(labelFor(r.to))}</div><div class="item-meta">${esc(r.label||'Relation')}</div></div><button class="btn small danger" data-action="delete-item" data-kind="relations" data-id="${r.id}">×</button></div>`).join('')}</div>`:empty('⌘','Aucune relation','Reliez deux informations pour commencer à construire votre graphe.')}</section></div>`;}
function labelFor(id){for(const k of ['articles','events','dossiers']){const x=scoped(k).find(z=>z.id===id);if(x)return x.title;}return 'Élément retiré';}
function drawGraph(){const svg=document.getElementById('knowledgeGraph');if(!svg)return;const nodes=[...scoped('dossiers').map(x=>({id:x.id,label:x.title,kind:'Dossier'})),...scoped('events').map(x=>({id:x.id,label:x.title,kind:'Événement'})),...scoped('articles').map(x=>({id:x.id,label:x.title,kind:'Article'}))].slice(0,35);if(!nodes.length){svg.innerHTML='<text x="380" y="205" fill="#94a3b8" text-anchor="middle" font-size="13">Ajoutez des dossiers, événements ou articles pour construire le graphe.</text>';return;}const cx=380,cy=210,rx=nodes.length===1?0:Math.min(260,90+nodes.length*5),ry=nodes.length===1?0:Math.min(145,55+nodes.length*3);const pos=nodes.map((n,i)=>({ ...n,x:cx+(nodes.length===1?0:Math.cos((i/nodes.length)*Math.PI*2-Math.PI/2)*rx),y:cy+(nodes.length===1?0:Math.sin((i/nodes.length)*Math.PI*2-Math.PI/2)*ry)}));const byId=Object.fromEntries(pos.map(p=>[p.id,p]));const rel=scoped('relations').filter(r=>byId[r.from]&&byId[r.to]);let html='';rel.forEach(r=>{const a=byId[r.from],b=byId[r.to];html+=`<line class="graph-edge" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;});pos.forEach(p=>{const label=p.label.length>22?p.label.slice(0,20)+'…':p.label;html+=`<g><circle class="graph-node" cx="${p.x}" cy="${p.y}" r="25"/><text class="graph-node-kind" x="${p.x}" y="${p.y-3}">${p.kind.toUpperCase().slice(0,8)}</text><text class="graph-node-label" x="${p.x}" y="${p.y+40}">${esc(label)}</text></g>`;});svg.innerHTML=html;}
function renderLibrary(){const items=scoped('resources').filter(x=>x.category!=='Science & Space');return `${pageHead('Knowledge / Reference archive','Bibliothèque','Conservez des liens, documents et références utiles. Les pièces jointes binaires ne sont pas stockées par cette version.',actionBtn('new-resource','＋ Ajouter une ressource','primary'))}<div class="callout" style="margin-bottom:14px">Pour préserver la confidentialité, les ressources sont des métadonnées et des liens enregistrés localement. L’import de fichiers PDF avec indexation complète nécessitera un module documentaire dédié.</div><section class="panel panel-pad"><div class="panel-head"><h2 class="panel-title">Ma bibliothèque</h2><span class="tag">${items.length} RESSOURCE(S)</span></div>${items.length?`<div class="list">${items.map(x=>resourceRow(x)).join('')}</div>`:empty('▧','Bibliothèque vide','Ajoutez une URL, un document de référence ou une note bibliographique.')}</section>`;}
function resourceRow(x){return `<div class="list-row"><span class="item-marker"></span><div class="item-body"><div class="item-title">${esc(x.title)}</div><div class="item-meta">${esc(x.type||'Ressource')} · ${esc(x.category||'Général')} · ${fmtDate(x.createdAt)}</div>${x.url?`<a class="tiny" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">Ouvrir la ressource ↗</a>`:''}${x.note?`<div class="muted tiny">${esc(x.note)}</div>`:''}</div><button class="btn small danger" data-action="delete-item" data-kind="resources" data-id="${x.id}">×</button></div>`;}
function renderReports(){const arts=scoped('articles'),events=scoped('events'),dossiers=scoped('dossiers');return `${pageHead('Knowledge / Export engine','Rapports','Générez un compte rendu exportable à partir des informations présentes dans votre espace.',`<button class="btn primary" data-action="generate-report">Générer un rapport</button>`)}<div class="grid grid-2"><section class="panel panel-pad"><h2 class="panel-title">Périmètre du rapport</h2><div class="list" style="margin-top:13px"><div class="list-row"><span class="item-marker"></span><div class="item-body"><div class="item-title">${arts.length} articles</div><div class="item-meta">Titres, sources, dates et résumés enregistrés.</div></div></div><div class="list-row"><span class="item-marker"></span><div class="item-body"><div class="item-title">${events.length} événements</div><div class="item-meta">Priorités, lieux, descriptions et dates.</div></div></div><div class="list-row"><span class="item-marker"></span><div class="item-body"><div class="item-title">${dossiers.length} dossiers</div><div class="item-meta">Titres et descriptions de votre mémoire.</div></div></div></div><button class="btn primary" style="margin-top:15px" data-action="generate-report">↓ Exporter en Markdown</button></section><section class="panel panel-pad"><h2 class="panel-title">Aperçu</h2><div class="report-preview" id="reportPreview">Le rapport apparaîtra ici après génération. Il sera basé exclusivement sur vos données locales.</div></section></div>`;}
function renderFX(){const p=state.prefs;return `${pageHead('System / Personal interface','Mobile FX Studio','Personnalisez l’apparence et le confort de votre environnement NEXUS.',actionBtn('reset-theme','Réinitialiser','ghost'))}<div class="grid grid-2"><section class="panel panel-pad"><h2 class="panel-title">Identité visuelle</h2><div class="form-field" style="margin-top:16px"><label>Couleur d’accent</label><div class="range-row"><input class="color-input" type="color" id="accentColor" value="${esc(p.accent)}"><span class="mono tiny" id="accentValue">${esc(p.accent)}</span></div></div><div class="form-field" style="margin-top:17px"><label>Taille du texte</label><div class="range-row"><input type="range" id="fontScale" min="0.9" max="1.15" step="0.01" value="${p.fontScale}"><span class="mono tiny" id="fontScaleValue">${Math.round(p.fontScale*100)}%</span></div></div><div class="divider"></div>${toggleSetting('compact','Interface compacte','Réduit légèrement les espacements.',p.compact)}${toggleSetting('glass','Transparences maîtrisées','Active le flou sur les éléments fixes.',p.glass)}${toggleSetting('motion','Transitions fluides','Désactive les animations lorsque nécessaire.',p.motion)}</section><section class="panel panel-pad"><h2 class="panel-title">Prévisualisation</h2><div class="entity-card" style="margin-top:14px"><div class="eyebrow">HYBRID INTELLIGENCE</div><h3>Clarté. Contexte. Connexion.</h3><p>Une interface conçue pour hiérarchiser l’information, pas pour la surcharger.</p><button class="btn primary">Accent actif</button></div><div class="divider"></div><div class="callout">Le mode par défaut est Balanced : animations discrètes, surfaces navy, accents cyan et contraste lisible.</div></section></div>`;}
function toggleSetting(id,label,desc,value){return `<label class="list-row" style="align-items:center;cursor:pointer"><div class="item-body"><div class="item-title">${label}</div><div class="item-meta">${desc}</div></div><input type="checkbox" data-pref="${id}" ${value?'checked':''} style="accent-color:var(--accent);width:17px;height:17px"></label>`;}
function renderSettings(){return `${pageHead('System / Control panel','Paramètres','Gestion de votre espace local, sauvegardes, préférences et intégrité des données.','')}<div class="grid grid-2"><section class="panel panel-pad"><h2 class="panel-title">Workspace</h2><p class="muted tiny">Espace actif : <strong>${esc(currentWorkspace().name)}</strong></p><button class="btn" data-action="workspace-menu">Gérer les espaces</button><div class="divider"></div><h2 class="panel-title">Données et sauvegarde</h2><p class="muted tiny">Exportez toutes vos informations en JSON pour les sauvegarder ou les transférer.</p><div class="head-actions"><button class="btn primary" data-action="export-backup">↓ Exporter la sauvegarde</button><button class="btn" data-action="import-backup">↑ Importer</button><input type="file" id="backupInput" accept="application/json,.json" hidden></div><div class="divider"></div><button class="btn danger" data-action="clear-workspace">Effacer les données de cet espace</button></section><section class="panel panel-pad"><h2 class="panel-title">État des capacités</h2><div class="list" style="margin-top:13px">${[['Stockage local','Disponible','green'],['Favoris et dossiers','Disponible','green'],['Export JSON / Markdown','Disponible','green'],['Carte interactive','Internet requis','amber'],['Flux actualités automatiques','Non connecté','amber'],['Cotations financières','Non connecté','amber'],['IA et synthèses automatiques','Non connecté','amber'],['Notifications push','Non inclus',''],['Synchronisation cloud','Non incluse','']].map(x=>`<div class="list-row"><div class="item-body"><div class="item-title">${x[0]}</div></div><span class="tag ${x[2]}">${x[1]}</span></div>`).join('')}</div></section></div><div class="callout" style="margin-top:15px"><strong>Confidentialité :</strong> les données sont conservées dans le stockage local de ce navigateur. Elles peuvent être perdues si les données du site sont effacées. Pensez à exporter une sauvegarde JSON.</div>`;}
function initMap(){const el=document.getElementById('worldMap');if(!el)return;if(!window.L){el.innerHTML='<div class="map-fallback"><div><div style="font-size:26px;color:var(--accent)">◎</div><strong>Carte interactive en attente</strong><p class="tiny">La carte nécessite une connexion Internet pour charger Leaflet et les tuiles OpenStreetMap. Vos événements restent disponibles dans la liste.</p><button class="btn small" data-action="new-event">＋ Ajouter un événement avec coordonnées</button></div></div>';loadLeaflet();return;}try{if(mapInstance){mapInstance.remove();mapInstance=null;}mapInstance=L.map(el,{zoomControl:true,scrollWheelZoom:false}).setView([22,8],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(mapInstance);scoped('events').filter(e=>Number.isFinite(+e.lat)&&Number.isFinite(+e.lng)).forEach(e=>{L.circleMarker([+e.lat,+e.lng],{radius:7,color:'#dffaff',weight:2,fillColor:state.prefs.accent,fillOpacity:.9}).addTo(mapInstance).bindPopup(`<strong>${esc(e.title)}</strong><br>${esc(e.location||'')}<br>${esc(e.priority||'Normale')}`);});setTimeout(()=>mapInstance&&mapInstance.invalidateSize(),120);}catch(err){console.warn(err);el.innerHTML='<div class="map-fallback">Impossible de charger la carte. Vos données ne sont pas affectées.</div>';}}
function loadLeaflet(){if(mapScriptPromise)return mapScriptPromise;mapScriptPromise=new Promise(resolve=>{if(document.querySelector('script[data-leaflet]'))return resolve();const css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(css);const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.dataset.leaflet='1';s.onload=()=>{if(currentPage==='map')initMap();resolve();};s.onerror=()=>resolve();document.head.appendChild(s);});return mapScriptPromise;}
function modal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" data-action="backdrop-close"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${title}</h2><button class="icon-button" data-action="close-modal">✕</button></div><div class="modal-body">${body}</div></div></div>`;}
function field(label,name,placeholder='',opts={}){const type=opts.type||'text',value=opts.value??'',req=opts.required?'required':'';if(type==='textarea')return `<div class="form-field ${opts.full?'full':''}"><label>${label}</label><textarea class="textarea" name="${name}" placeholder="${placeholder}" ${req}>${esc(value)}</textarea></div>`;return `<div class="form-field ${opts.full?'full':''}"><label>${label}</label><input class="field" name="${name}" type="${type}" placeholder="${placeholder}" value="${esc(value)}" ${req} ${opts.step?`step="${opts.step}"`:''} ${opts.min!==undefined?`min="${opts.min}"`:''} ${opts.max!==undefined?`max="${opts.max}"`:''}></div>`;}
function selectField(label,name,choices,value=''){return `<div class="form-field"><label>${label}</label><select class="select" name="${name}">${choices.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;}
function modalForm(title,fields,submitLabel,formAction,extra=''){modal(title,`<form data-form="${formAction}"><div class="form-grid">${fields}</div>${extra}<div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Annuler</button><button class="btn primary" type="submit">${submitLabel}</button></div></form>`);}
function newArticle(){modalForm('Ajouter une information',field('Titre','title','Titre de l’article',{full:true,required:true})+field('Source','source','Nom du média ou de l’institution')+selectField('Catégorie','category',['France','Monde','Politique','Économie','Technologie','Sciences','Environnement','Défense','Exploration','Autre'])+field('Lien original','url','https://…',{type:'url',full:true})+field('Résumé personnel','summary','Quelques lignes de contexte',{type:'textarea',full:true}),'Enregistrer','article');}
function newEvent(existing=null){const e=existing||{};modalForm(existing?'Modifier l’événement':'Créer un événement',field('Titre','title','Nom de l’événement',{full:true,required:true,value:e.title})+field('Lieu','location','Ville, région ou pays',{value:e.location})+selectField('Catégorie','category',['Politique','Conflit','Diplomatie','Économie','Environnement','Science','Autre'],e.category||'Politique')+selectField('Priorité','priority',['Faible','Normale','Élevée'],e.priority||'Normale')+field('Latitude','lat','Ex. 48.8566',{type:'number',step:'any',value:e.lat})+field('Longitude','lng','Ex. 2.3522',{type:'number',step:'any',value:e.lng})+field('Date de l’événement','date','',{type:'date',value:e.date?e.date.slice(0,10):new Date().toISOString().slice(0,10)})+field('Description','description','Contexte, évolution, points à vérifier',{type:'textarea',full:true,value:e.description}),'Enregistrer',existing?`event-edit:${e.id}`:'event');}
function newDossier(){modalForm('Créer un dossier',field('Nom du dossier','title','Ex. Économie européenne',{full:true,required:true})+field('Description','description','Objectif et périmètre du dossier',{type:'textarea',full:true}),'Créer le dossier','dossier');}
function newAnalysis(existing=null){const a=existing||{};modalForm(existing?'Modifier l’analyse':'Nouvelle analyse',field('Titre','title','Titre de travail',{full:true,required:true,value:a.title})+field('Sujet','topic','Domaine ou événement',{value:a.topic})+field('Question centrale','question','Quelle question cherchez-vous à éclairer ?',{full:true,value:a.question})+field('Faits documentés','facts','Éléments appuyés par une source',{type:'textarea',full:true,value:a.facts})+field('Hypothèses','hypotheses','Pistes à vérifier, non établies',{type:'textarea',full:true,value:a.hypotheses})+field('Incertitudes / contradictions','uncertainties','Ce qui reste inconnu ou contesté',{type:'textarea',full:true,value:a.uncertainties}),'Enregistrer',existing?`analysis-edit:${a.id}`:'analysis');}
function newSource(){modalForm('Ajouter une source',field('Nom','name','Nom du média ou organisme',{required:true})+field('URL','url','https://…',{type:'url',required:true})+field('Nature','kind','Média, institution, source primaire…')+selectField('Catégorie','category',['Actualités','Sciences','Économie','Institution','Autre']),'Ajouter','source');}
function newResource(){modalForm('Ajouter une ressource',field('Titre','title','Titre du document ou de la référence',{required:true,full:true})+field('URL','url','https://…',{type:'url',full:true})+selectField('Type','type',['Article','Rapport','Document','Publication scientifique','Site web','Autre'])+selectField('Catégorie','category',['Général','Science & Space','Économie','Politique','Technologie','Histoire','Autre'])+field('Note','note','Pourquoi conserver cette ressource ?',{type:'textarea',full:true}),'Enregistrer','resource');}
function newMarket(){modalForm('Ajouter un actif à la watchlist',field('Nom','name','Or, CAC 40, Airbus…',{required:true})+selectField('Type','type',['Indice','Action','Matière première','Métal précieux','Devise','Autre'])+field('Symbole','symbol','Ex. CAC, AIR.PA, XAU/USD')+field('Note personnelle','note','Pourquoi suivre cet actif ?',{type:'textarea',full:true}),'Ajouter à la watchlist','market');}
function newRelation(){const all=[...scoped('dossiers').map(x=>({id:x.id,label:'Dossier · '+x.title})),...scoped('events').map(x=>({id:x.id,label:'Événement · '+x.title})),...scoped('articles').map(x=>({id:x.id,label:'Article · '+x.title}))];if(all.length<2){toast('Ajoutez au moins deux éléments avant de créer une relation.');return;}const opts=all.map(x=>`<option value="${x.id}">${esc(x.label)}</option>`).join('');modalForm('Créer une relation',`<div class="form-field full"><label>Premier élément</label><select class="select" name="from">${opts}</select></div><div class="form-field full"><label>Deuxième élément</label><select class="select" name="to">${opts}</select></div>`+field('Nature du lien','label','Ex. concerne, précède, contredit…',{full:true}),'Créer la relation','relation');}
function openDossier(id){const d=scoped('dossiers').find(x=>x.id===id);if(!d)return;const arts=scoped('articles').filter(a=>(d.articleIds||[]).includes(a.id));const events=scoped('events').filter(e=>(d.eventIds||[]).includes(e.id));modal(d.title,`<p class="muted tiny">${esc(d.description||'Aucune description')}</p><div class="divider"></div><div class="panel-head"><h3 class="panel-title">Articles associés</h3><button class="btn small" data-action="attach-article" data-id="${d.id}">＋ Ajouter</button></div>${arts.length?arts.map(a=>`<div class="list-row"><div class="item-body"><div class="item-title">${esc(a.title)}</div><div class="item-meta">${esc(a.source||'')} · ${fmtDate(a.createdAt)}</div></div></div>`).join(''):'<p class="muted tiny">Aucun article associé.</p>'}<div class="divider"></div><div class="panel-head"><h3 class="panel-title">Événements associés</h3><button class="btn small" data-action="attach-event" data-id="${d.id}">＋ Ajouter</button></div>${events.length?events.map(e=>`<div class="list-row"><div class="item-body"><div class="item-title">${esc(e.title)}</div><div class="item-meta">${esc(e.location||'')} · ${fmtDate(e.date||e.createdAt)}</div></div></div>`).join(''):'<p class="muted tiny">Aucun événement associé.</p>'}<div class="divider"></div><button class="btn" data-action="edit-dossier" data-id="${d.id}">Modifier les informations</button>`);}
function attachToDossier(id,kind){const d=scoped('dossiers').find(x=>x.id===id),items=scoped(kind);if(!d||!items.length){toast('Aucun élément disponible.');return;}const opts=items.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');modal('Associer un élément',`<form data-form="attach" data-id="${id}" data-kind="${kind}"><div class="form-field"><label>Élément à associer</label><select class="select" name="itemId">${opts}</select></div><div class="modal-actions"><button class="btn" type="button" data-action="close-modal">Annuler</button><button class="btn primary">Associer</button></div></form>`);}
function searchModal(){modal('Recherche globale',`<input class="field" id="globalSearchInput" placeholder="Articles, événements, dossiers, ressources…" value="${esc(lastSearch)}" autofocus><div id="globalSearchResults" class="search-results" style="margin-top:13px"></div><div class="helper" style="margin-top:10px">La recherche porte sur les données enregistrées dans cet espace local.</div>`);runSearch(lastSearch);setTimeout(()=>document.getElementById('globalSearchInput')?.focus(),50);}
function runSearch(q){lastSearch=q;const root=document.getElementById('globalSearchResults');if(!root)return;const term=q.trim().toLowerCase();if(!term){root.innerHTML='<div class="empty"><strong>Recherche dans votre espace</strong><p>Saisissez un titre, un sujet ou un nom de source.</p></div>';return;}const buckets=[['articles','Article'],['events','Événement'],['dossiers','Dossier'],['resources','Ressource'],['analyses','Analyse']];const found=[];buckets.forEach(([key,label])=>scoped(key).forEach(x=>{const text=JSON.stringify(x).toLowerCase();if(text.includes(term))found.push({key,label,x});}));root.innerHTML=found.length?found.slice(0,30).map(r=>`<button class="search-result" data-action="search-open" data-kind="${r.key}" data-id="${r.x.id}"><strong>${esc(r.x.title||r.x.name)}</strong><small>${r.label} · ${esc(r.x.source||r.x.category||'')}</small></button>`).join(''):'<div class="empty"><strong>Aucun résultat</strong><p>Essayez un autre terme ou enregistrez de nouvelles informations.</p></div>';}
function exportFile(name,content,type='text/plain;charset=utf-8'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function reportText(){const w=currentWorkspace(),arts=scoped('articles'),events=scoped('events'),dossiers=scoped('dossiers');let out=`# NEXUS — Rapport de veille\n\nEspace : ${w.name}\nGénéré le : ${fmtDate(nowISO(),true)}\n\n> Ce rapport reprend uniquement les données enregistrées dans NEXUS. Il ne constitue pas une vérification indépendante des informations.\n\n## Événements suivis\n`;out+=events.length?events.map(e=>`### ${e.title}\n- Date : ${fmtDate(e.date||e.createdAt)}\n- Lieu : ${e.location||'Non précisé'}\n- Priorité : ${e.priority||'Normale'}\n- Description : ${e.description||'—'}\n`).join('\n'):'Aucun événement enregistré.\n';out+='\n## Articles conservés\n';out+=arts.length?arts.map(a=>`- **${a.title}** — ${a.source||'Source non précisée'} (${fmtDate(a.createdAt)})${a.url?' — '+a.url:''}\n  ${a.summary||''}`).join('\n'):'Aucun article enregistré.\n';out+='\n## Dossiers\n';out+=dossiers.length?dossiers.map(d=>`- **${d.title}** — ${d.description||'Sans description'}`).join('\n'):'Aucun dossier enregistré.';return out;}
function exportBackup(){exportFile('NEXUS_V15_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2),'application/json');toast('Sauvegarde exportée.');}
function workspaceMenu(){modal('Espaces de travail',`<div class="list">${state.workspaces.map(w=>`<div class="list-row" style="align-items:center"><div class="item-body"><div class="item-title">${esc(w.name)} ${w.id===state.activeWorkspaceId?'<span class="tag green">ACTIF</span>':''}</div><div class="item-meta">Espace local indépendant</div></div><button class="btn small" data-action="switch-workspace" data-id="${w.id}">Ouvrir</button></div>`).join('')}</div><div class="divider"></div><form data-form="workspace"><div class="form-field"><label>Nom du nouvel espace</label><input class="field" name="name" placeholder="Ex. Études, Géopolitique…" required></div><div class="modal-actions"><button class="btn primary">Créer un espace</button></div></form>`);}
function handleAction(el,ev){const a=el.dataset.action,id=el.dataset.id,kind=el.dataset.kind;switch(a){case'open-drawer':document.getElementById('mobileDrawer').classList.add('open');break;case'close-drawer':document.getElementById('mobileDrawer').classList.remove('open');break;case'open-search':searchModal();break;case'close-modal':document.getElementById('modalRoot').innerHTML='';break;case'backdrop-close':if(ev && el===ev.target)document.getElementById('modalRoot').innerHTML='';break;case'new-article':newArticle();break;case'new-event':newEvent();break;case'edit-event':newEvent(scoped('events').find(x=>x.id===id));break;case'new-dossier':newDossier();break;case'new-analysis':newAnalysis();break;case'edit-analysis':newAnalysis(scoped('analyses').find(x=>x.id===id));break;case'new-source':newSource();break;case'new-resource':newResource();break;case'new-market':newMarket();break;case'new-relation':newRelation();break;case'workspace-menu':workspaceMenu();break;case'switch-workspace':if(state.workspaces.some(w=>w.id===id)){state.activeWorkspaceId=id;save();document.getElementById('modalRoot').innerHTML='';render();toast('Espace de travail changé.');}break;case'new-watch':newWatch();break;case'toggle-archive':{const item=scoped(kind).find(x=>x.id===id);if(item){item.archived=!item.archived;item.updatedAt=nowISO();save();render();toast(item.archived?'Élément archivé.':'Élément restauré.');}break;}case'toggle-item-favorite':{const item=scoped(kind).find(x=>x.id===id);if(item){item.favorite=!item.favorite;item.updatedAt=nowISO();save();render();}break;}case'go-settings':setPage('settings');break;case'export-backup':exportBackup();break;case'import-backup':document.getElementById('backupInput')?.click();break;case'generate-report':{const txt=reportText();const p=document.getElementById('reportPreview');if(p)p.textContent=txt;exportFile('NEXUS_rapport_'+new Date().toISOString().slice(0,10)+'.md',txt,'text/markdown;charset=utf-8');toast('Rapport Markdown généré.');break;}case'reset-theme':state.prefs={...freshStore().prefs};save();applyPrefs();render();toast('Apparence réinitialisée.');break;case'clear-workspace':if(confirm('Effacer toutes les données de cet espace ? Cette action est irréversible sans sauvegarde.')){['articles','events','dossiers','analyses','resources','relations','market','datasets','watchTopics'].forEach(k=>state[k]=state[k].filter(x=>x.workspaceId!==state.activeWorkspaceId));save();render();toast('Espace vidé.');}break;case'toggle-source':{const s=state.sources.find(x=>x.id===id);if(s){s.enabled=!s.enabled;save();render();}break;}case'toggle-favorite':{const x=scoped('articles').find(x=>x.id===id);if(x){x.favorite=!x.favorite;save();render();}break;}case'delete-item':if(confirm('Supprimer cet élément ?')){state[kind]=state[kind].filter(x=>x.id!==id);save();render();toast('Élément supprimé.');}break;case'open-dossier':openDossier(id);break;case'attach-article':attachToDossier(id,'articles');break;case'attach-event':attachToDossier(id,'events');break;case'article-to-dossier':if(!scoped('dossiers').length){toast('Créez d’abord un dossier.');return;}attachToDossierPrompt(id);break;case'focus-event':{const e=scoped('events').find(x=>x.id===id);if(e&&mapInstance&&e.lat&&e.lng){mapInstance.setView([+e.lat,+e.lng],7);const marker=L.circleMarker([+e.lat,+e.lng]).addTo(mapInstance);marker.bindPopup(esc(e.title)).openPopup();}else toast('Coordonnées absentes ou carte non chargée.');break;}case'edit-dossier':{const d=scoped('dossiers').find(x=>x.id===id);if(!d)return;modalForm('Modifier le dossier',field('Nom','title','',{value:d.title,required:true,full:true})+field('Description','description','',{type:'textarea',value:d.description,full:true}),'Enregistrer',`dossier-edit:${id}`);break;}case'import-csv':document.getElementById('csvInput')?.click();break;case'search-open':{const x=scoped(kind).find(x=>x.id===id);document.getElementById('modalRoot').innerHTML='';if(kind==='dossiers')openDossier(id);else if(kind==='articles')setPage('news');else if(kind==='events')setPage('timeline');else if(kind==='resources')setPage('library');else if(kind==='analyses')setPage('analyst');break;}case'workspace-menu':workspaceMenu();break;}}
function attachToDossierPrompt(articleId){const article=scoped('articles').find(a=>a.id===articleId);if(!article)return;const opts=scoped('dossiers').map(d=>`<option value="${d.id}">${esc(d.title)}</option>`).join('');modal('Ajouter à un dossier',`<form data-form="article-attach" data-article="${articleId}"><div class="form-field"><label>Dossier</label><select class="select" name="dossierId">${opts}</select></div><div class="modal-actions"><button class="btn" type="button" data-action="close-modal">Annuler</button><button class="btn primary">Associer</button></div></form>`);}
function handleSubmit(form){const fd=new FormData(form),v=Object.fromEntries(fd.entries()),type=form.dataset.form;const cleanUrl=safeUrl(v.url||'');switch(type){case'article':if(v.url&&!cleanUrl){toast('URL invalide.');return;}addScoped('articles',{title:v.title.trim(),source:v.source.trim(),category:v.category,url:cleanUrl,summary:v.summary.trim(),favorite:false,archived:false});break;case'event':if(v.lat!==''&&(!Number.isFinite(+v.lat)||+v.lat < -90||+v.lat>90)){toast('Latitude invalide.');return;}if(v.lng!==''&&(!Number.isFinite(+v.lng)||+v.lng < -180||+v.lng>180)){toast('Longitude invalide.');return;}addScoped('events',{title:v.title.trim(),location:v.location.trim(),category:v.category,priority:v.priority,lat:v.lat===''?null:+v.lat,lng:v.lng===''?null:+v.lng,date:v.date,description:v.description.trim(),favorite:false,archived:false});break;case'dossier':addScoped('dossiers',{title:v.title.trim(),description:v.description.trim(),articleIds:[],eventIds:[]});break;case'analysis':addScoped('analyses',{title:v.title.trim(),topic:v.topic.trim(),question:v.question.trim(),facts:v.facts.trim(),hypotheses:v.hypotheses.trim(),uncertainties:v.uncertainties.trim()});break;case'source':if(!cleanUrl){toast('URL invalide.');return;}state.sources.push({id:uid(),name:v.name.trim(),url:cleanUrl,kind:v.kind.trim()||'Source externe',category:v.category,enabled:true,custom:true});save();break;case'resource':if(v.url&&!cleanUrl){toast('URL invalide.');return;}addScoped('resources',{title:v.title.trim(),url:cleanUrl,type:v.type,category:v.category,note:v.note.trim()});break;case'market':addScoped('market',{name:v.name.trim(),type:v.type,symbol:v.symbol.trim(),note:v.note.trim()});break;case'watch':addScoped('watchTopics',{title:v.title.trim(),category:v.category,priority:v.priority,active:true});break;case'relation':if(v.from===v.to){toast('Choisissez deux éléments différents.');return;}addScoped('relations',{from:v.from,to:v.to,label:v.label.trim()||'Relation'});break;case'attach':{const d=scoped('dossiers').find(x=>x.id===form.dataset.id);if(!d)return;const arr=form.dataset.kind==='articles'?'articleIds':'eventIds';d[arr]=d[arr]||[];if(!d[arr].includes(v.itemId))d[arr].push(v.itemId);d.updatedAt=nowISO();save();break;}case'article-attach':{const d=scoped('dossiers').find(x=>x.id===v.dossierId);if(!d)return;d.articleIds=d.articleIds||[];if(!d.articleIds.includes(form.dataset.article))d.articleIds.push(form.dataset.article);d.updatedAt=nowISO();save();break;}case'workspace':{const name=v.name.trim();if(!name)return;const w={id:uid(),name,createdAt:nowISO()};state.workspaces.push(w);state.activeWorkspaceId=w.id;save();break;}default:if(type.startsWith('event-edit:')){const id=type.split(':')[1],e=scoped('events').find(x=>x.id===id);if(e){Object.assign(e,{title:v.title.trim(),location:v.location.trim(),category:v.category,priority:v.priority,lat:v.lat===''?null:+v.lat,lng:v.lng===''?null:+v.lng,date:v.date,description:v.description.trim(),updatedAt:nowISO()});save();}}else if(type.startsWith('analysis-edit:')){const id=type.split(':')[1],a=scoped('analyses').find(x=>x.id===id);if(a){Object.assign(a,{title:v.title.trim(),topic:v.topic.trim(),question:v.question.trim(),facts:v.facts.trim(),hypotheses:v.hypotheses.trim(),uncertainties:v.uncertainties.trim(),updatedAt:nowISO()});save();}}else if(type.startsWith('dossier-edit:')){const id=type.split(':')[1],d=scoped('dossiers').find(x=>x.id===id);if(d){d.title=v.title.trim();d.description=v.description.trim();d.updatedAt=nowISO();save();}}}
document.getElementById('modalRoot').innerHTML='';render();toast('Enregistré localement.');}
function applyPrefs(){const p=state.prefs;document.documentElement.style.setProperty('--accent',p.accent);const hex=p.accent.replace('#','');const n=parseInt(hex,16);const r=(n>>16)&255,g=(n>>8)&255,b=n&255;document.documentElement.style.setProperty('--accent-rgb',`${r},${g},${b}`);document.documentElement.style.setProperty('--font-scale',p.fontScale);document.body.classList.toggle('compact',!!p.compact);document.body.classList.toggle('no-glass',!p.glass);document.body.classList.toggle('reduce-motion',!p.motion);}
function handleChange(target){if(target.dataset.pref){state.prefs[target.dataset.pref]=target.checked;save();applyPrefs();return;}if(target.id==='accentColor'){state.prefs.accent=target.value;save();applyPrefs();const out=document.getElementById('accentValue');if(out)out.textContent=target.value;}if(target.id==='fontScale'){state.prefs.fontScale=+target.value;save();applyPrefs();const out=document.getElementById('fontScaleValue');if(out)out.textContent=Math.round(+target.value*100)+'%';}if(target.id==='newsCategory'||target.id==='newsFilter')filterNews();}
function filterNews(){const term=(document.getElementById('newsFilter')?.value||'').toLowerCase(),cat=document.getElementById('newsCategory')?.value||'';const arts=scoped('articles').filter(a=>!a.archived&&(!cat||a.category===cat)&&JSON.stringify(a).toLowerCase().includes(term));const root=document.getElementById('newsList');if(root)root.innerHTML=newsList(arts);}
function parseCSV(text){const first=(text.split(/\r?\n/,1)[0]||'');const sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++;}else if(c==='"'){quoted=!quoted;}else if(c===sep&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);row=[];cell='';}else cell+=c;}row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);if(rows.length<2)throw new Error('Le CSV doit contenir un en-tête et au moins une ligne.');const headers=rows.shift().map(x=>x.trim());return {headers,rows:rows.map(r=>headers.map((_,i)=>(r[i]||'').trim()))};}
// Event delegation
 document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){setPage(page.dataset.page);return;}const act=e.target.closest('[data-action]');if(act){handleAction(act,e);return;}if(e.target.id==='mobileDrawer')document.getElementById('mobileDrawer').classList.remove('open');});
document.addEventListener('submit',e=>{const form=e.target.closest('form[data-form]');if(form){e.preventDefault();handleSubmit(form);}});
document.addEventListener('input',e=>{if(e.target.id==='globalSearchInput')runSearch(e.target.value);if(e.target.id==='newsFilter')filterNews();if(e.target.id==='fontScale')handleChange(e.target);});
document.addEventListener('change',e=>{if(e.target.id==='backupInput'&&e.target.files[0]){const file=e.target.files[0],reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!parsed||!Array.isArray(parsed.workspaces))throw new Error('Format non reconnu');if(confirm('Remplacer les données NEXUS actuelles par cette sauvegarde ?')){state=parsed;save();applyPrefs();render();toast('Sauvegarde importée.');}}catch(err){toast('Sauvegarde invalide.');}};reader.readAsText(file);e.target.value='';return;}if(e.target.id==='csvInput'&&e.target.files[0]){const file=e.target.files[0],reader=new FileReader();reader.onload=()=>{try{const data=parseCSV(String(reader.result));addScoped('datasets',{name:file.name,headers:data.headers,rows:data.rows.slice(0,5000)});render();toast('Jeu de données importé.');}catch(err){toast(err.message||'CSV invalide.');}};reader.readAsText(file);e.target.value='';return;}handleChange(e.target);});
// Hidden CSV input is created once so the main HTML remains self-contained.
const csvInput=document.createElement('input');csvInput.type='file';csvInput.id='csvInput';csvInput.accept='.csv,text/csv';csvInput.hidden=true;document.body.appendChild(csvInput);
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchModal();}if(e.key==='Escape'){document.getElementById('modalRoot').innerHTML='';document.getElementById('mobileDrawer').classList.remove('open');}});
applyPrefs();render();
})();
</script>
</body>
</html>
